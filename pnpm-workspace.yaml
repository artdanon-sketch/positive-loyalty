packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 больше не читает поле "pnpm" из package.json — все настройки менеджера живут здесь.
# Без allowBuilds установка падает с ERR_PNPM_IGNORED_BUILDS и ломает вообще все pnpm-скрипты.
#
# true  — постинсталл нужен по делу (сборка нативных бинарников, распаковка платформенных артефактов);
# false — скрипт осознанно запрещён, но решение зафиксировано, чтобы install не спрашивал снова.
allowBuilds:
  '@nestjs/core': false # opencollective-баннер в консоли: пользы ноль, время сборки тратит
  '@scarf/scarf': false # телеметрия установок; отправлять её из CI мы не подписывались
  '@swc/core': true # распаковывает нативный биндинг — без него не работает трансформ в vitest
  esbuild: true # тоже нативный бинарник, на нём держится vite
  msgpackr-extract: true # опциональный нативный ускоритель сериализации для bullmq

# Репозиторий пиновый: версии зафиксированы точно и подняты дымовым тестом.
# Глобальная задержка «свежие релизы не ставить» здесь только мешает — pnpm начинает
# дописывать в этот файл minimumReleaseAgeExclude на каждую новую версию.
minimumReleaseAge: 0
