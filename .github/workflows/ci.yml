# ─────────────────────────────────────────────────────────────────────────────
# CI — единственный обязательный гейт перед мержем.
# docs/06_Процесс_и_дорожная_карта.md, раздел 3.
#
# Порядок шагов зафиксирован постановкой задачи и менять его не нужно:
# lint → typecheck → gitleaks → test → build.
# Дешёвые проверки идут первыми, чтобы очевидная ошибка падала за минуту.
# Format:check вписан рядом с lint по тому же принципу: это самая дешёвая
# проверка в наборе, и порядок обязательных шагов она не нарушает.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  # У pull_request фильтра по базовой ветке НЕТ — и это осознанно.
  #
  # Было `branches: [main]`, и гейт молча не срабатывал на стопочных PR:
  # PR #2 с базой chore/monorepo-ci не запустил ни одной проверки, а GitHub
  # показал mergeStateStatus = CLEAN. PR без проверок выглядит ровно так же
  # зелено, как проверенный, — и мержится так же легко.
  # Стопки PR это нормальная практика, гейт обязан работать для всех.
  pull_request:
  push:
    branches: [main]

# Новый пуш в ту же ветку отменяет предыдущий прогон: незачем греть раннеры
# на коде, который уже устарел. На main отмену тоже держим — main всегда
# деплоится с последнего коммита.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Минимум прав, но не меньше необходимого.
#
# contents: read       — checkout читает код и историю.
# pull-requests: read  — на событии pull_request gitleaks-action запрашивает
#                        GET /repos/:owner/:repo/pulls/:n/commits, чтобы понять,
#                        какие коммиты сканировать. Без этого права шаг падает
#                        с 403 «Resource not accessible by integration».
#                        Проверено на первом же прогоне: PR #1, run 32812968330.
#
# pull-requests: write НЕ нужен: комментарии gitleaks в PR выключены ниже.
permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Postgres для интеграционных тестов ledger.
    # docs/06, раздел 3: «test:integration — поднимает postgres в сервисе».
    # Без него четыре обязательных теста Задачи 2 гоняются только на машине
    # разработчика, то есть не гоняются: сломать их может кто угодно и заметит
    # это лично он, а не гейт.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: positive_loyalty
        ports:
          - 5432:5432
        # Без healthcheck шаги стартуют раньше, чем база готова принимать
        # соединения, и первый же тест падает на ECONNREFUSED.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # gitleaks сканирует историю коммитов, а не только рабочее дерево,
          # поэтому мелкий клон не годится.
          fetch-depth: 0

      - name: Setup pnpm
        # Версию здесь НЕ дублируем: action читает packageManager из package.json.
        # Один источник правды — иначе рано или поздно разъедется.
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        # Prettier проверяет форматирование, не чинит его. Шаг стоит сразу после
        # lint: он самый дешёвый из всех и падает за секунды. Локальная починка —
        # `pnpm format`.
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Gitleaks
        # Сканер секретов в CI — требование docs/05_Безопасность_и_антифрод.md,
        # раздел 9: «Один закоммиченный ключ дороже дня работы».
        #
        # ВАЖНО ПРО ЛИЦЕНЗИЮ:
        #   • личный репозиторий (владелец — пользователь) — работает бесплатно,
        #     GITLEAKS_LICENSE не нужен;
        #   • репозиторий в организации GitHub — экшену ОБЯЗАТЕЛЕН ключ
        #     GITLEAKS_LICENSE, иначе шаг падает с ошибкой лицензии.
        # Если переносим репозиторий под организацию — сначала получаем ключ на
        # gitleaks.io, кладём в Secrets репозитория как GITLEAKS_LICENSE.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Не комментируем PR — иначе понадобится pull-requests: write.
          GITLEAKS_ENABLE_COMMENTS: false
          # Правила и allowlist — в .gitleaks.toml в корне репозитория.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

      - name: Test
        run: pnpm test

      - name: Test integration
        # Четыре обязательных теста Задачи 2: идемпотентность, гонка двух
        # начислений, компенсация возврата, сверка кэша с журналом.
        # docs/06, раздел 2: «Если тест на гонку не проходит — вся остальная
        # работа бессмысленна».
        #
        # Миграция накатывается отдельным шагом до тестов: append-only задаётся
        # триггерами из migration.sql, и без них тесты проверяли бы пустоту.
        #
        # ДВЕ РАЗНЫЕ БАЗЫ, а не одна. Сначала я указал обе переменные на
        # positive_loyalty_test, и прогон отбила защита из
        # test/integration/setup-integration-env.ts: тесты пишут в журнал
        # строки, которые физически нельзя удалить (append-only), поэтому
        # общая база с рабочей копилась бы мусором навсегда.
        # Проверка сработала как задумано — оставляем разведение баз.
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/positive_loyalty?schema=public
          DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/positive_loyalty_test?schema=public
          PGPASSWORD: postgres
        run: |
          # Пароль роли и секрет токена ГЕНЕРИРУЮТСЯ здесь, а не лежат в файле.
          #
          # Сначала они были вписаны в этот workflow строками — и gitleaks
          # справедливо остановил PR: даже одноразовые учётные данные в
          # репозитории это учётные данные в репозитории. Расширять allowlist
          # было бы лечением симптома: сканер начал бы пропускать целый класс
          # находок ради двух строк, которых вообще не должно существовать.
          APP_PASSWORD="$(openssl rand -hex 16)"
          export ACCESS_TOKEN_SECRET="$(openssl rand -base64 36)"
          export DATABASE_URL_TEST_APP_ROLE="postgresql://positive_app:${APP_PASSWORD}@127.0.0.1:5432/positive_loyalty_test?schema=public"

          # Сервис создаёт только positive_loyalty (POSTGRES_DB). Тестовую заводим рядом.
          psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE positive_loyalty_test;'

          # Миграция идёт на ТЕСТОВУЮ базу: именно к ней подключаются тесты.
          # Она же создаёт роль positive_app — без пароля и без права входа.
          DATABASE_URL="$DATABASE_URL_TEST" pnpm db:deploy

          # Вход и пароль выдаём отдельным шагом: в миграции их быть не должно.
          psql -h 127.0.0.1 -U postgres -d positive_loyalty_test \
            -c "ALTER ROLE positive_app LOGIN PASSWORD '${APP_PASSWORD}';"

          pnpm --filter @positive/api run test:integration

      - name: Test integration (своя схема)
        # ДОКАЗАТЕЛЬСТВО ИЗОЛЯЦИИ СХЕМ, а не повтор предыдущего шага.
        #
        # Система едет в проект Supabase, где уже живёт чужой продукт: у нас своя
        # схема, у соседа public. Прогон выше этого НЕ проверяет — он идёт
        # на schema=public, то есть ровно в том случае, который работает
        # по совпадению с умолчанием.
        #
        # ГЛАВНЫЙ ТРЮК ЗДЕСЬ — ТАБЛИЦА-ДВОЙНИК. В public заводится "Membership"
        # с заведомо чужой строкой. Если хоть один запрос уйдёт не в ту схему,
        # он увидит соседа: сырой SQL дашборда обращается к "Membership"
        # без указания схемы и разрешается по search_path.
        #
        # Без двойника тест был бы бессилен: на пустом public промах в схему
        # дал бы честную ошибку «нет такой таблицы», и мы бы решили, что
        # защищены. Молчаливое чтение чужих данных — вот чего мы боимся,
        # и воспроизводится оно только так.
        env:
          DATABASE_SCHEMA: loyalty
          PGPASSWORD: postgres
        run: |
          APP_PASSWORD="$(openssl rand -hex 16)"
          export ACCESS_TOKEN_SECRET="$(openssl rand -base64 36)"

          DB=positive_loyalty_schema
          export DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/${DB}"
          export DATABASE_URL_TEST="$DATABASE_URL"
          export DATABASE_URL_TEST_APP_ROLE="postgresql://positive_app:${APP_PASSWORD}@127.0.0.1:5432/${DB}"

          psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE ${DB};"

          # Сосед по базе: чужая таблица с НАШИМ именем и чужой строкой.
          psql -h 127.0.0.1 -U postgres -d "${DB}" <<'SQL'
          CREATE TABLE public."Membership" (id text primary key, marker text);
          INSERT INTO public."Membership" VALUES ('neighbour-row', 'ЧУЖАЯ СТРОКА САЙТА');
          SQL

          # СЛЕПОК СХЕМЫ СОСЕДА ДО НАКАТА.
          #
          # Пересчёт по списку НАШИХ имён ловит только то, о чём мы догадались
          # заранее. Сравнение слепков ловит всё: любую таблицу, любую функцию,
          # любое изменение прав на схеме. Утверждение «мы к соседу не лезли»
          # должно опираться на это, а не на нашу же фантазию о том, что могло
          # пойти не так.
          SNAP() {
            psql -h 127.0.0.1 -U postgres -d "${DB}" -tAc "
              SELECT (SELECT count(*) FROM information_schema.tables
                      WHERE table_schema = 'public')
                  || ' таблиц / '
                  || (SELECT count(*) FROM pg_proc p
                      JOIN pg_namespace n ON n.oid = p.pronamespace
                      WHERE n.nspname = 'public')
                  || ' функций / права: '
                  || (SELECT coalesce(array_to_string(nspacl, ','), 'по умолчанию')
                      FROM pg_namespace WHERE nspname = 'public');"
          }

          CHECK_PUBLIC() {
            local now
            now="$(SNAP)"
            if [ "${PUBLIC_BEFORE}" != "${now}" ]; then
              echo "СБОЙ: схема соседа изменилась (${1})."
              echo "  было:  ${PUBLIC_BEFORE}"
              echo "  стало: ${now}"
              exit 1
            fi
            echo "  ${1}: ${now} — без изменений"
          }

          PUBLIC_BEFORE="$(SNAP)"

          pnpm db:deploy

          echo "── Схема соседа не изменилась ни на объект, ни на право ──"
          CHECK_PUBLIC "после наката миграций"

          psql -h 127.0.0.1 -U postgres -d "${DB}"             -c "ALTER ROLE positive_app LOGIN PASSWORD '${APP_PASSWORD}';"

          echo "── Наши таблицы обязаны быть в loyalty, а не у соседа ──"
          psql -h 127.0.0.1 -U postgres -d "${DB}" -tAc "
            SELECT count(*) FROM information_schema.tables
            WHERE table_schema = 'loyalty'
              AND table_name IN ('LedgerEntry','Membership','Tenant','PosLink');"             | grep -qx '4' || { echo 'СБОЙ: таблицы не в схеме loyalty'; exit 1; }

          echo "── В public не должно быть НАШИХ таблиц: только двойник соседа ──"
          psql -h 127.0.0.1 -U postgres -d "${DB}" -tAc "
            SELECT count(*) FROM information_schema.tables
            WHERE table_schema = 'public'
              AND table_name IN ('LedgerEntry','Tenant','PosLink');"             | grep -qx '0' || { echo 'СБОЙ: наши таблицы попали в схему соседа'; exit 1; }

          echo "── Функции тоже не должны остаться у соседа ──"
          psql -h 127.0.0.1 -U postgres -d "${DB}" -tAc "
            SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public' AND p.proname IN (
              'auth_tenant_for_device','pos_link_for_merchant',
              'webhook_deliveries_due','ledger_entries_awaiting_delivery');"             | grep -qx '0' || { echo 'СБОЙ: функции остались в схеме соседа'; exit 1; }

          echo "── Полный прогон интеграционных тестов на схеме loyalty ──"
          pnpm --filter @positive/api run test:integration

          echo "── Схема соседа не изменилась и после работы приложения ──"
          CHECK_PUBLIC "после прогона тестов"

          echo "── Строка соседа НЕ ТРОНУТА: мы в его схему не писали ──"
          psql -h 127.0.0.1 -U postgres -d "${DB}" -tAc             "SELECT marker FROM public.\"Membership\" WHERE id = 'neighbour-row';"             | grep -q 'ЧУЖАЯ СТРОКА САЙТА' || { echo 'СБОЙ: строка соседа изменена'; exit 1; }

          psql -h 127.0.0.1 -U postgres -d "${DB}" -tAc             "SELECT count(*) FROM public.\"Membership\";"             | grep -qx '1' || { echo 'СБОЙ: в таблицу соседа что-то дописали'; exit 1; }

          echo "── RLS: роль приложения без объявленного заведения не видит ничего ──"
          PGPASSWORD="${APP_PASSWORD}" psql -h 127.0.0.1 -U positive_app -d "${DB}" -tAc             'SELECT count(*) FROM loyalty."Membership";'             | grep -qx '0' || { echo 'СБОЙ: RLS не действует — вероятно, подключились владельцем'; exit 1; }

          echo "Изоляция схем подтверждена."

      - name: Build
        run: pnpm build
