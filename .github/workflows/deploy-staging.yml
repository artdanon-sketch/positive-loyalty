# ─────────────────────────────────────────────────────────────────────────────
# ЗАГОТОВКА. Деплой staging после зелёного CI на main.
# docs/06_Процесс_и_дорожная_карта.md раздел 3, docs/01_Архитектура_и_данные.md раздел 7.
#
# main всегда деплоится, но только зелёный: workflow запускается не по пушу,
# а по завершению CI на main, и job стоит под условием conclusion == 'success'.
# Иначе упавшие тесты уезжали бы в staging — при squash-merge коммит в main новый,
# и PR-гейт его не покрывает.
#
# Проекты Railway и Cloudflare ЕЩЁ НЕ СОЗДАНЫ — имена в env ниже плейсхолдеры,
# ЗАМЕНИТЕ их. Без секретов workflow проходит зелёным и ничего не делает.
# Гейтинг тот же: secrets недоступны в `if` на уровне job, поэтому секрет
# пробрасывается в env, а условие стоит на шаге.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Деплои staging не гоняем параллельно, но и не отменяем начатый: половина
# выкатки хуже, чем лишняя минута ожидания.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  # ── ПЛЕЙСХОЛДЕРЫ, заменить на реальные имена проектов ──────────────────────
  RAILWAY_API_SERVICE: positive-loyalty-api
  RAILWAY_WORKER_SERVICE: positive-loyalty-worker
  RAILWAY_ENVIRONMENT: staging
  CLOUDFLARE_ADMIN_PROJECT: positive-loyalty-admin
  CLOUDFLARE_GUEST_PROJECT: positive-loyalty-guest
  # Ветка Cloudflare Pages, привязанная к staging-домену.
  CLOUDFLARE_STAGING_BRANCH: staging
  # ── Секреты ───────────────────────────────────────────────────────────────
  # Аккаунтный токен (Account Settings → Tokens): один секрет на все окружения,
  # включая динамические pr-N. Project-token привязан к паре проект + окружение,
  # поэтому одним и тем же секретом три workflow обслужить не смог бы.
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  # Аккаунтный токен не знает, какой проект деплоить, а на чистом раннере
  # нет .railway со ссылкой на него — поэтому id проекта задаётся явно.
  RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  staging:
    name: staging
    # Красный CI не выкатываем. Отменённый и пропущенный прогон — тоже не «успех».
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run по умолчанию берёт голову ветки по умолчанию, а нам нужен
          # ровно тот коммит, который проверил CI.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # ── Миграции идут ДО деплоя кода ───────────────────────────────────────
      # docs/06_Процесс_и_дорожная_карта.md, раздел 3: «Миграции применяются
      # отдельным шагом до деплоя кода и должны быть обратимо совместимы».
      # Шаг включается в Задаче 2, когда появится prisma/schema.prisma.
      - name: Apply migrations (staging)
        if: env.RAILWAY_TOKEN != '' && env.RAILWAY_PROJECT_ID != ''
        run: echo "TODO(Задача 2) — prisma migrate deploy на базу staging"

      # ── Railway: api и worker ──────────────────────────────────────────────
      - name: Install Railway CLI
        if: env.RAILWAY_TOKEN != '' && env.RAILWAY_PROJECT_ID != ''
        run: npm install -g @railway/cli

      # `railway up` не угадывает проект: аккаунтный токен даёт доступ ко всем
      # проектам сразу, а привязки на раннере нет. Линкуем явно — иначе команда
      # падает с ошибкой о непривязанном проекте.
      - name: Link Railway project
        if: env.RAILWAY_TOKEN != '' && env.RAILWAY_PROJECT_ID != ''
        run: railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service "$RAILWAY_API_SERVICE"

      - name: Deploy api to Railway staging
        if: env.RAILWAY_TOKEN != '' && env.RAILWAY_PROJECT_ID != ''
        run: railway up --service "$RAILWAY_API_SERVICE" --environment "$RAILWAY_ENVIRONMENT" --ci

      - name: Deploy worker to Railway staging
        if: env.RAILWAY_TOKEN != '' && env.RAILWAY_PROJECT_ID != ''
        run: railway up --service "$RAILWAY_WORKER_SERVICE" --environment "$RAILWAY_ENVIRONMENT" --ci

      # ── Cloudflare Pages: admin и guest ────────────────────────────────────
      - name: Deploy admin to Cloudflare Pages staging
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/admin/dist --project-name=${{ env.CLOUDFLARE_ADMIN_PROJECT }} --branch=${{ env.CLOUDFLARE_STAGING_BRANCH }}

      - name: Deploy guest to Cloudflare Pages staging
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/guest/dist --project-name=${{ env.CLOUDFLARE_GUEST_PROJECT }} --branch=${{ env.CLOUDFLARE_STAGING_BRANCH }}

      - name: Report skipped targets
        if: env.RAILWAY_TOKEN == '' || env.RAILWAY_PROJECT_ID == '' || env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        # GitHub запускает run через `bash -e`, поэтому конструкция
        # `[ -z "$X" ] && echo ...` уронила бы шаг, когда условие ложно.
        # Пишем через if/fi.
        run: |
          {
            echo "### Деплой staging пропущен"
            echo
            if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_PROJECT_ID" ]; then
              echo "- Railway — нет RAILWAY_TOKEN / RAILWAY_PROJECT_ID, api и worker не задеплоены."
            fi
            if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
              echo "- Cloudflare Pages — нет CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID, admin и guest не задеплоены."
            fi
            echo
            echo "Это ожидаемо, пока деплой не подключён. Подробности — в README, раздел «Окружения и деплой»."
          } >> "$GITHUB_STEP_SUMMARY"
